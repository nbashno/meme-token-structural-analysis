name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck (experience layer)
        run: npm run typecheck:experience
      - name: Tests + architecture guards
        run: npm test
